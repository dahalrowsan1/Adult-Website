<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0710">
<title>ROSUU STREAM</title>
<!-- ROSUU STREAM: single file. Paste your Firebase web config into FB below to enable shared videos + admin login. Leave FB empty for local-only mode. -->
<style>
:root{--bg:#0a0710;--panel:#15101f;--panel2:#1d1629;--line:#2c2240;--text:#f5f0fc;--mute:#a99dbd;--red:#ff3d5a;--purple:#8b5cf6;--grad:linear-gradient(135deg,var(--red),var(--purple));--r:16px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 500px at 85% -10%,#8b5cf633,transparent),radial-gradient(700px 400px at 0% 0%,#ff3d5a22,transparent),var(--bg);background-attachment:fixed;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:#0a0710ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:1.25rem;letter-spacing:.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;white-space:nowrap}
.search{flex:1 1 220px;order:3;position:relative;min-width:0}
.search input{width:100%;padding:11px 40px 11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);outline:0}
.search input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #8b5cf633}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--mute)}
.hdr .sp{flex:1}
.btn{padding:10px 16px;border-radius:999px;font-weight:700;border:1px solid var(--line);background:var(--panel2);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--purple)}
.btn.pri{background:var(--grad);border:0;box-shadow:0 6px 22px #ff3d5a44}
.btn.pri:hover{box-shadow:0 8px 28px #8b5cf666}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.danger{color:#ff7a8d}
.wrap{max-width:1600px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:600;white-space:nowrap}
.chip b{font-weight:600;opacity:.7;margin-left:6px}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.meta{color:var(--mute);font-size:.9rem;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1500px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{text-align:left;display:block;width:100%}
.th{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--panel2) linear-gradient(100deg,transparent 30%,#ffffff12 50%,transparent 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .th{box-shadow:0 0 0 2px var(--purple),0 10px 30px #8b5cf655}
.card:hover .th img{transform:scale(1.05)}
.tag{position:absolute;left:8px;top:8px;background:#000a;padding:2px 8px;border-radius:999px;font-size:.72rem}
.ct{font-weight:700;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;font-size:.95rem}
.cc{color:var(--mute);font-size:.8rem}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:60px 16px;color:var(--mute)}
.empty h2{color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:14px}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 0 60px #8b5cf633}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play-gate{position:absolute;inset:0;display:grid;place-items:center;background:#080510;color:#fff}
.play-gate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82}
.play-gate:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0009,transparent 65%);pointer-events:none}
.play-gate button{position:relative;z-index:2;padding:16px 28px;font-size:1.15rem;border-radius:999px;background:linear-gradient(135deg,#ff3d5a,#8b5cf6);font-weight:800;box-shadow:0 8px 30px #0009}
.play-gate .count{position:absolute;z-index:2;bottom:14px;left:12px;right:12px;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 8px #000}
.watch{display:grid;gap:22px}
@media(min-width:1000px){.watch{grid-template-columns:minmax(0,1fr) 340px}}
.watch h1{font-size:1.4rem;line-height:1.25;margin:14px 0 6px}
.note{font-size:.85rem;color:var(--mute);margin-top:10px}
.note a{color:#c4b5fd}
.desc{white-space:pre-wrap;margin-top:12px;background:var(--panel);padding:14px;border-radius:var(--r);border:1px solid var(--line)}
.rel{display:grid;gap:12px;align-content:start}
.rel .card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px}
.rel .ct{margin:0}
.rel h2{font-size:1.05rem}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.ov[hidden]{display:none}
.adm{max-width:900px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 60px}
.warn{background:#ff3d5a1a;border:1px solid #ff3d5a66;border-radius:12px;padding:10px 14px;font-size:.85rem;margin:10px 0 16px}
.f{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.f label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.f input,.f textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.f textarea{min-height:80px;resize:vertical}
.req:after{content:" *";color:var(--red)}
.err{color:#ff8a9b;font-size:.88rem;display:grid;gap:2px}
.pv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pv .box{aspect-ratio:16/9;border:1px dashed var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:.8rem;position:relative}
.pv img,.pv iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:grid;gap:8px;margin-top:10px}
.li{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.li img{width:84px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none}
.li .t{flex:1;min-width:0;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{display:block;color:var(--mute);font-weight:400}
.sw{background:#000;touch-action:none;overflow:hidden}
.sw .stage{position:absolute;inset:0;display:grid;place-items:center}
.sw .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(28px) brightness(.45);transform:scale(1.15)}
.sw .box{position:relative;width:100%;aspect-ratio:16/9;background:#000;box-shadow:0 0 50px #000}
.sw .box img,.sw .box iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.sw .shade{position:absolute;left:0;right:0;bottom:0;padding:90px 16px max(28px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000d);pointer-events:none}
.sw .shade h2{font-size:1.2rem}
.sw .shade p{color:#d6c9ee;font-size:.85rem}
.sw .acts{position:absolute;left:0;right:0;top:calc(50% + 14vw + 18px);display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
@media(min-width:700px){.sw .box{max-width:min(92vw,calc((100vh - 200px)*16/9))}.sw .acts{top:auto;bottom:130px}}
.sw .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 12px}
.sw .nav{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:2}
.rb{width:46px;height:46px;border-radius:50%;background:#000a;border:1px solid #fff3;font-size:1.2rem}
.rb:disabled{opacity:.3}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--purple);padding:10px 18px;border-radius:999px;z-index:99;font-size:.9rem;box-shadow:0 8px 30px #000a}
.toast[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hdr">
  <a class="logo" href="#/" aria-label="ROSUU STREAM home">ROSUU STREAM</a>
  <div class="sp"></div>
  <button class="btn pri" id="swBtn">Swipe Videos</button>
  <button class="btn" id="admBtn">Admin</button>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="Search title, category, description" aria-label="Search videos" autocomplete="off">
    <button id="qx" aria-label="Clear search" hidden>&#10005;</button>
  </div>
</header>
<main class="wrap" id="app"></main>

<section class="ov" id="admin" role="dialog" aria-modal="true" aria-label="Admin dashboard" hidden></section>
<section class="ov sw" id="swipe" role="dialog" aria-modal="true" aria-label="Swipe videos" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const KEY="rosuu.videos.v1";
/* ===== SETTINGS ===== */
const FB={apiKey:"AIzaSyCJwhpj-kcWwFnnfFVE6ukNZdsDi4KI5Ps",authDomain:"video-4717a.firebaseapp.com",projectId:"video-4717a",appId:"1:706941818392:web:d2c9347581dd1a6d1b556d"}; /* Firebase web config (public values, safe to paste) */
const SMART_LINK="https://arkgleamfox.com/a9kd2x33?key=b7943234e014c166181e59862fca2997"; /* default sponsor link */
let cloud=!!FB.apiKey,fb=null,user=null,loading=cloud;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s||"").trim().replace(/\s+/g," ");
const key=s=>clean(s).toLowerCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const art=(a,b,t)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><text x="320" y="190" fill="#fff" fill-opacity=".85" font-family="sans-serif" font-size="30" text-anchor="middle">${t}</text></svg>`);
const FALLBACK=art("#2c2240","#15101f","Thumbnail unavailable");

/* ---------- storage (falls back to memory if blocked) ---------- */
let mem=null;
function samples(){return[
 {id:uid(),sample:1,title:"Sample video: YouTube embed",thumb:art("#ff3d5a","#8b5cf6","SAMPLE 1"),embed:"https://www.youtube.com/embed/jNQXAC9IVRw",desc:"Sample entry to show the layout. Delete it in Admin and add your own.",cat:"Samples",ad:""},
 {id:uid(),sample:1,title:"Sample video: Vimeo embed",thumb:art("#8b5cf6","#1d4ed8","SAMPLE 2"),embed:"https://player.vimeo.com/video/76979871",desc:"Sample entry. Vimeo embeds work the same way.",cat:"Samples",ad:""},
 {id:uid(),sample:1,title:"Sample video: site that blocks embedding",thumb:art("#be123c","#4c1d95","SAMPLE 3"),embed:"https://example.com/",desc:"Many sites refuse to load inside an iframe. This sample shows what that looks like and how the fallback link helps.",cat:"Demo",ad:""},
 {id:uid(),sample:1,title:"Sample video: with optional sponsor link",thumb:art("#f97316","#be185d","SAMPLE 4"),embed:"https://www.youtube.com/embed/jNQXAC9IVRw",desc:"Sample entry with an optional, clearly labeled sponsor link.",cat:"Demo",ad:"https://example.com/"}]}
function load(){try{const r=localStorage.getItem(KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a))return a}}catch(e){}
 const s=samples();save(s);return s}
function save(a){if(cloud)return true;mem=a;try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
let V=cloud?[]:load();

/* ---------- url helpers ---------- */
function okUrl(u){try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}}
function toEmbed(u){u=clean(u);if(!okUrl(u))return null;const x=new URL(u),h=x.hostname.replace(/^www\.|^m\./,"");let id;
 if(h==="youtu.be"){id=x.pathname.slice(1).split("/")[0];return id?"https://www.youtube.com/embed/"+id:null}
 if(h==="youtube.com"||h==="youtube-nocookie.com"){
  if(x.pathname==="/watch"){id=x.searchParams.get("v");return id?"https://www.youtube.com/embed/"+id:null}
  const m=x.pathname.match(/^\/(shorts|live)\/([\w-]+)/);if(m)return "https://www.youtube.com/embed/"+m[2];return u}
 if(h==="vimeo.com"){const m=x.pathname.match(/^\/(\d+)/);return m?"https://player.vimeo.com/video/"+m[1]:u}
 return u}
const safe=u=>(okUrl(u)||/^data:image\/(svg\+xml,|jpeg;base64,)/.test(String(u||"")))?esc(u):"";

/* ---------- derived data ---------- */
function cats(){const m=new Map();V.forEach(v=>{const k=key(v.cat);if(!m.has(k))m.set(k,{name:clean(v.cat),n:0});m.get(k).n++});return[...m.values()].sort((a,b)=>a.name.localeCompare(b.name))}
let cat="",q="";
function filtered(){const s=key(q);return V.filter(v=>(!cat||key(v.cat)===key(cat))&&(!s||[v.title,v.cat,v.desc].some(t=>key(t).includes(s))))}

/* ---------- views ---------- */
const app=$("#app");
function card(v){return `<button class="card" data-open="${esc(v.id)}" aria-label="Watch ${esc(v.title)}"><div class="th"><img src="${safe(v.thumb)}" alt="" loading="lazy" decoding="async"><span class="tag">${esc(v.cat)}</span></div><div class="ct">${esc(v.title)}</div></button>`}
function home(){
 if(loading){app.innerHTML=`<div class="empty"><p>Loading videos...</p></div>`;return}
 if(cat&&!cats().some(c=>key(c.name)===key(cat)))cat="";
 const list=filtered(),cs=cats();
 let h=`<div class="chips" role="tablist" aria-label="Categories"><button class="chip ${cat?"":"on"}" data-cat="">All Videos<b>${V.length}</b></button>${cs.map(c=>`<button class="chip ${key(c.name)===key(cat)?"on":""}" data-cat="${esc(c.name)}">${esc(c.name)}<b>${c.n}</b></button>`).join("")}</div>`;
 if(!V.length)h+=`<div class="empty"><h2>No videos yet</h2><p>Open Admin to add your first video.</p><button class="btn pri" data-act="admin">Open Admin</button></div>`;
 else if(!list.length)h+=`<div class="empty"><h2>No matches</h2><p>Nothing found${q?` for “${esc(q)}”`:""}. Try another word or category.</p><button class="btn" data-act="reset">Show all videos</button></div>`;
 else h+=`<p class="meta">${list.length} video${list.length>1?"s":""}${cat?" in "+esc(cat):""}</p><div class="grid">${list.map(card).join("")}</div>`;
 app.innerHTML=h}
function watch(id){
 const v=V.find(x=>x.id===id);if(!v){location.hash="#/";return}
 const rel=[...V.filter(x=>x.id!==id&&key(x.cat)===key(v.cat)),...V.filter(x=>x.id!==id&&key(x.cat)!==key(v.cat))].slice(0,8);
 const em=toEmbed(v.embed),ad=v.ad||SMART_LINK;
 app.innerHTML=`<button class="btn sm" data-act="back" style="margin-bottom:12px">&larr; Back</button><div class="watch"><div><div class="player" id="mainPlayer">${em?`<div class="play-gate"><img src="${safe(v.thumb||FALLBACK)}" alt="${esc(v.title)} thumbnail"><button type="button" data-act="start-video">▶ Click Here To Play</button><div class="count" id="gateCount">Click to continue • Video starts in 5 seconds</div></div>`:`<div class="empty">Invalid embed URL. Edit this video in Admin.</div>`}</div>
 <p class="note">Player blank or showing an error? Some sites block embedding. ${em?`<a href="${safe(em)}" target="_blank" rel="noopener noreferrer">Open the video in a new tab</a>.`:""}</p>
 <h1>${esc(v.title)}</h1><span class="chip on" style="display:inline-block">${esc(v.cat)}</span>
 ${v.desc?`<div class="desc">${esc(v.desc)}</div>`:""}
 ${ad&&okUrl(ad)?`<p style="margin-top:12px"><a class="btn sm" style="display:inline-block;text-decoration:none" href="${safe(ad)}" target="_blank" rel="sponsored noopener noreferrer">Support the site: Visit Sponsor (optional)</a></p>`:""}</div>
 <aside class="rel"><h2>Related videos</h2>${rel.length?rel.map(card).join(""):`<p class="cc">No other videos yet.</p>`}</aside></div>`;
 scrollTo(0,0)}
function route(){const m=location.hash.match(/^#\/watch\/(.+)$/);m?watch(decodeURIComponent(m[1])):home()}
addEventListener("hashchange",route);

app.addEventListener("click",e=>{
 const t=e.target.closest("[data-open],[data-cat],[data-act]");if(!t)return;
 if(t.dataset.open){location.hash="#/watch/"+encodeURIComponent(t.dataset.open)}
 else if(t.dataset.cat!==undefined){cat=t.dataset.cat;home()}
 else if(t.dataset.act==="admin")openAdmin();
 else if(t.dataset.act==="reset"){cat="";q="";$("#q").value="";$("#qx").hidden=true;home()}
 else if(t.dataset.act==="back"){location.hash="#/"}
  else if(t.dataset.act==="start-video"){
    const match=location.hash.match(/^#\/watch\/(.+)$/);
    const v=match&&V.find(x=>x.id===decodeURIComponent(match[1]));
    const em=v&&toEmbed(v.embed),ad=v&&(v.ad||SMART_LINK),player=$("#mainPlayer");
    if(!v||!em||!player){toast("Video could not be loaded.");return}
    if(ad&&okUrl(ad)){
      const opened=window.open(ad,"_blank","noopener,noreferrer");
      if(!opened)toast("Browser blocked the sponsor tab. Continuing to video.");
    }
    let n=5;
    player.innerHTML=`<div class="play-gate"><img src="${safe(v.thumb||FALLBACK)}" alt="${esc(v.title)} thumbnail"><div class="count" id="gateCount">Video starts in ${n} seconds…</div></div>`;
    const tick=()=>{
      n--;
      const c=$("#gateCount");
      if(n<=0){
        player.innerHTML=`<iframe src="${safe(em)}" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      }else if(c){c.textContent=`Video starts in ${n} seconds…`;setTimeout(tick,1000)}
    };
    setTimeout(tick,1000);
  }});

/* search */
$("#q").addEventListener("input",e=>{q=e.target.value;$("#qx").hidden=!q;if(location.hash.startsWith("#/watch"))location.hash="#/";else home()});
$("#qx").addEventListener("click",()=>{q="";$("#q").value="";$("#qx").hidden=true;home();$("#q").focus()});

/* images: fallback for broken thumbs, remove shimmer on load */
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.src!==FALLBACK){i.src=FALLBACK}},true);
document.addEventListener("load",e=>{const i=e.target;if(i.tagName==="IMG"&&i.parentElement.classList.contains("th"))i.parentElement.style.animation="none"},true);

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- admin ---------- */
const adm=$("#admin");let editId=null;
function openAdmin(){adm.hidden=false;document.body.style.overflow="hidden";renderAdmin()}
function closeAdmin(){adm.hidden=true;document.body.style.overflow="";route()}
$("#admBtn").onclick=openAdmin;
function renderAdmin(v){
 if(cloud&&!user){renderLogin();return}
 v=v||{};
 adm.innerHTML=`<div class="adm"><div class="row" style="justify-content:space-between"><h1>Admin dashboard</h1><div class="row">${cloud?`<button class="btn" data-a="out">Sign out</button>`:""}<button class="btn" data-a="close">Close</button></div></div>
 ${cloud?`<div class="warn">Signed in as ${esc(user&&user.email)}. Changes are shared with all visitors. Only the admin email named in your Firestore rules can save.</div>`:`<div class="warn"><b>Local mode, not secure:</b> no login, and changes are saved only in this browser. Add your Firebase config (FB at the top of the file) to enable admin login and shared videos.</div>`}
 <form class="f" id="vf" novalidate><h2>${editId?"Edit video":"Add a video"}</h2>
 <label><span class="req">Video title</span><input name="title" value="${esc(v.title)}" maxlength="140"></label>
 <label><span class="req">Embed / iframe URL</span><input name="embed" inputmode="url" placeholder="YouTube, Vimeo, or supported video embed URL" value="${esc(v.embed)}"></label>
 <label>Thumbnail image URL (optional)<input name="thumb" inputmode="url" placeholder="https://.../thumbnail.jpg — use for other sites" value="${esc(okUrl(v.thumb)?v.thumb:"")}"><small>If the video site does not provide thumbnail data automatically, paste a direct image URL here.</small></label>
 <label><span class="req">Category</span><input name="cat" list="cl" placeholder="Pick one or type a new one" value="${esc(v.cat)}" maxlength="40"><datalist id="cl">${cats().map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist></label>
 <label>Description<textarea name="desc" maxlength="1500">${esc(v.desc)}</textarea></label>
 <label>Smart link (optional, shown as a labeled “Visit Sponsor” button)<input name="ad" inputmode="url" placeholder="https://..." value="${esc(v.ad)}"></label>
 <div class="pv"><div class="box" id="pvT">Thumbnail: automatic from the video link</div><div class="box" id="pvE">Embed preview</div></div>
 <div class="row"><button type="button" class="btn sm" data-a="pv">Preview thumbnail and embed</button></div>
 <div class="err" id="errs" aria-live="polite"></div>
 <div class="row"><button class="btn pri" type="submit">${editId?"Save changes":"Add video"}</button>${editId?`<button type="button" class="btn" data-a="cancel">Cancel edit</button>`:""}</div></form>
 <h2 style="margin-top:22px">All videos (${V.length})</h2>
 <div class="list">${V.map(x=>`<div class="li"><img src="${safe(x.thumb)}" alt="" loading="lazy"><div class="t">${esc(x.title)}<small>${esc(x.cat)}${x.sample?" · sample":""}</small></div><button class="btn sm" data-a="edit" data-id="${esc(x.id)}">Edit</button><button class="btn sm danger" data-a="del" data-id="${esc(x.id)}">Delete</button></div>`).join("")||`<p class="cc">No videos. Add one above.</p>`}</div>
 <h2 style="margin-top:22px">Backup</h2><div class="row" style="margin-top:8px"><button class="btn sm" data-a="exp">Export JSON</button><label class="btn sm" style="cursor:pointer">Import JSON<input type="file" accept="application/json,.json" id="imp" hidden></label>${cloud?"":`<button class="btn sm danger" data-a="smp">Restore sample videos</button>`}</div></div>`;
 $("#imp").onchange=importJson;
 $("#vf").onsubmit=submitForm}
function readForm(){const f=new FormData($("#vf")),o={};["title","embed","thumb","cat","desc","ad"].forEach(k=>o[k]=String(f.get(k)||"").trim());return o}
function validate(o){const e=[];
 if(!o.title)e.push("Enter a video title.");
 if(!o.embed)e.push("Enter an embed URL.");else if(!toEmbed(o.embed))e.push("Embed URL is not valid. Use a full http(s) link.");
 if(!clean(o.cat))e.push("Choose or type a category.");
 if(o.ad&&!okUrl(o.ad))e.push("Ad link must be a full http(s) URL, or leave it empty.");
 if(o.thumb&&!okUrl(o.thumb))e.push("Thumbnail must be a full http(s) image URL, or leave it empty.");
 return e}
async function submitForm(ev){ev.preventDefault();const o=readForm(),e=validate(o);
 if(e.length){$("#errs").innerHTML=e.map(x=>`<div>&bull; ${esc(x)}</div>`).join("");return}
 const btn=ev.submitter;if(btn)btn.disabled=true;
 try{
  const em=toEmbed(o.embed),old=editId&&V.find(x=>x.id===editId),ex=V.find(x=>x.id!==editId&&key(x.cat)===key(o.cat));
  const th=o.thumb||((old&&old.embed===em&&old.thumb&&!old.thumb.startsWith("data:image/svg"))?old.thumb:await autoThumb(em,o.title,o.cat));
  await persist({id:editId||uid(),t:old&&old.t?old.t:Date.now(),title:o.title,thumb:th,embed:em,desc:o.desc,cat:ex?clean(ex.cat):clean(o.cat),ad:o.ad});
  toast(editId?"Video updated":"Video added");editId=null;renderAdmin();
 }catch(x){$("#errs").textContent="Could not save: "+(x.code||x.message)+". Check that you are signed in as the admin and your Firestore rules allow it.";if(btn)btn.disabled=false}}
adm.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==="close")closeAdmin();
 else if(a==="out")fb.signOut(fb.auth);
 else if(a==="cancel"){editId=null;renderAdmin()}
 else if(a==="edit"){editId=id;renderAdmin(V.find(x=>x.id===id));adm.scrollTo(0,0)}
 else if(a==="del"){const v=V.find(x=>x.id===id);if(v&&confirm(`Delete "${v.title}"? This cannot be undone.`)){try{await unpersist(id);if(editId===id)editId=null;renderAdmin();toast("Video deleted")}catch(x){toast("Delete not allowed. Sign in as admin.")}}}
 else if(a==="pv"){const o=readForm(),em=toEmbed(o.embed);
  $("#pvT").textContent="Loading...";const th=em?await autoThumb(em,o.title||"Preview",o.cat):null;
  $("#pvT").innerHTML=th?`<img src="${safe(th)}" alt="Thumbnail preview">`:"Enter a valid embed URL";
  $("#pvE").innerHTML=em?`<iframe src="${safe(em)}" title="Embed preview" allowfullscreen></iframe>`:"Enter a valid embed URL";
  if(em)toast("If the embed preview stays blank, that site may block iframes.")}
 else if(a==="exp"){const b=new Blob([JSON.stringify(V,null,2)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="rosuu-videos.json";l.click();setTimeout(()=>URL.revokeObjectURL(l.href),2000)}
 else if(a==="smp"){if(confirm("Add the sample videos back?")){V=[...samples(),...V];save(V);renderAdmin()}}});
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;
  const ok=a.filter(x=>x&&x.title&&toEmbed(x.embed)&&clean(x.cat)).map(x=>({id:uid(),t:Date.now(),title:String(x.title),thumb:okUrl(x.thumb)?x.thumb:"",embed:toEmbed(x.embed),desc:String(x.desc||""),cat:clean(x.cat),ad:okUrl(x.ad)?x.ad:""}));
  if(!ok.length)throw 0;
  if(confirm(`Import ${ok.length} video(s) and add them to the current list?`)){for(const v of ok){v.thumb=v.thumb||await autoThumb(v.embed,v.title,v.cat);await persist(v)}renderAdmin();toast("Imported "+ok.length+" videos")}
 }catch(x){toast("Import failed: invalid file, or not allowed")}};r.readAsText(f)}

/* ---------- thumbnails, storage, Firebase ---------- */
function frameOf(u){return new Promise(res=>{try{const v=document.createElement("video");v.crossOrigin="anonymous";v.muted=true;v.preload="metadata";v.playsInline=true;
 const end=x=>{clearTimeout(t);v.removeAttribute("src");v.load();res(x)},t=setTimeout(()=>end(null),9000);
 v.onerror=()=>end(null);
 v.onloadedmetadata=()=>{v.currentTime=Math.min(1.5,(v.duration||2)/2)};
 v.onseeked=()=>{try{const c=document.createElement("canvas");c.width=640;c.height=Math.round(640*(v.videoHeight||360)/(v.videoWidth||640));c.getContext("2d").drawImage(v,0,0,c.width,c.height);end(c.toDataURL("image/jpeg",.72))}catch(e){end(null)}};
 v.src=u}catch(e){res(null)}})}
async function autoThumb(em,title,cat){
 let m=em.match(/youtube(?:-nocookie)?\.com\/embed\/([\w-]+)/);
 if(m)return "https://i.ytimg.com/vi/"+m[1]+"/hqdefault.jpg";
 m=em.match(/player\.vimeo\.com\/video\/(\d+)/);
 if(m){try{const r=await fetch("https://vimeo.com/api/oembed.json?url="+encodeURIComponent("https://vimeo.com/"+m[1]));const j=await r.json();if(okUrl(j.thumbnail_url))return j.thumbnail_url}catch(e){}}
 m=em.match(/dailymotion\.com\/embed\/video\/([\w]+)/);
 if(m)return "https://www.dailymotion.com/thumbnail/video/"+m[1];
 if(/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(em)){const f=await frameOf(em);if(f)return f}
 const to=(u,ms)=>{const ac=new AbortController();setTimeout(()=>ac.abort(),ms);return fetch(u,{signal:ac.signal})};
 const abs=(u,b)=>{try{return new URL(u,b).href}catch(e){return ""}};
 try{const r=await to("https://api.allorigins.win/raw?url="+encodeURIComponent(em),7000),t=await r.text();
  const pats=[/<meta[^>]+(?:property|name)=["'](?:og:image(?::secure_url)?|twitter:image(?::src)?)["'][^>]*content=["']([^"']+)/i,/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["'](?:og:image|twitter:image)["']/i,/<video[^>]+poster=["']([^"']+)/i,/poster["']?\s*[:=]\s*["']([^"']+\.(?:jpe?g|png|webp)[^"']*)/i];
  for(const re of pats){const mm=t.match(re);if(mm){const u=abs(mm[1].replace(/&amp;/g,"&"),em);if(okUrl(u))return u}}}catch(e){}
 try{const r=await to("https://api.microlink.io/?url="+encodeURIComponent(em),8000),j=await r.json(),u=j&&j.data&&j.data.image&&j.data.image.url;if(okUrl(u))return u}catch(e){}
 try{const r=await to("https://api.microlink.io/?screenshot=true&meta=false&viewport.width=1280&viewport.height=720&url="+encodeURIComponent(em),15000),j=await r.json(),u=j&&j.data&&j.data.screenshot&&j.data.screenshot.url;if(okUrl(u))return u}catch(e){}
 let h=0;for(const c of String(title))h=(h*31+c.charCodeAt(0))%360;
 return art(`hsl(${h},70%,45%)`,`hsl(${(h+60)%360},70%,28%)`,esc(clean(title).slice(0,22)))}
async function persist(r){if(cloud)await fb.setDoc(fb.doc(fb.db,"videos",r.id),r);V=V.some(x=>x.id===r.id)?V.map(x=>x.id===r.id?r:x):[r,...V];if(!cloud)save(V)}
async function unpersist(id){if(cloud)await fb.deleteDoc(fb.doc(fb.db,"videos",id));V=V.filter(x=>x.id!==id);if(!cloud)save(V)}
async function refresh(){const s=await fb.getDocs(fb.collection(fb.db,"videos"));V=s.docs.map(d=>d.data()).sort((a,b)=>(b.t||0)-(a.t||0));loading=false;route();if(!adm.hidden)renderAdmin()}
async function initCloud(){
 try{const B="https://www.gstatic.com/firebasejs/10.12.2/";
  const [a,au,fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
  const ap=a.initializeApp(FB);fb={...au,...fs,auth:au.getAuth(ap),db:fs.getFirestore(ap)};
  au.onAuthStateChanged(fb.auth,u=>{user=u;if(!adm.hidden)renderAdmin()});
  await refresh();
 }catch(e){cloud=false;loading=false;V=load();route();toast("Firebase could not load. Using local mode.")}}
function renderLogin(){
 adm.innerHTML=`<div class="adm"><div class="row" style="justify-content:space-between"><h1>Admin login</h1><button class="btn" data-a="close">Close</button></div><form class="f" id="lf" style="margin-top:14px"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="pw" type="password" autocomplete="current-password" required></label><div class="err" id="errs" aria-live="polite"></div><button class="btn pri" type="submit">Sign in</button></form></div>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await fb.signInWithEmailAndPassword(fb.auth,f.get("email"),f.get("pw"))}catch(x){$("#errs").textContent="Sign-in failed. Check your email and password."}}}

/* ---------- swipe feed ---------- */
const sw=$("#swipe");let L=[],i=0,y0=null,lock=0;
function openSwipe(){L=filtered();sw.hidden=false;document.body.style.overflow="hidden";i=0;drawSwipe()}
function closeSwipe(){sw.hidden=true;sw.innerHTML="";document.body.style.overflow=""}
$("#swBtn").onclick=openSwipe;
function drawSwipe(){
 if(!L.length){sw.innerHTML=`<div class="top"><span></span><button class="btn" data-s="x">Close</button></div><div class="stage"><div class="empty"><h2>No videos to swipe</h2><p>Add a video in Admin first.</p></div></div>`;return}
 const v=L[i],em=toEmbed(v.embed);
 sw.innerHTML=`<div class="stage"><img class="bg" src="${safe(v.thumb)}" alt=""><div class="box" id="sb"><img src="${safe(v.thumb)}" alt="${esc(v.title)}"></div>
 <div class="acts"><button class="btn pri" data-s="play">Play here</button><button class="btn" data-s="open">Open full video</button></div>
 <div class="shade"><h2>${esc(v.title)}</h2><p>${esc(v.cat)}</p></div></div>
 <div class="top"><span class="chip on">${i+1}/${L.length}</span><button class="btn" data-s="x" aria-label="Close swipe mode">Close</button></div>
 <div class="nav"><button class="rb" data-s="p" aria-label="Previous video" ${i?"":"disabled"}>&uarr;</button><button class="rb" data-s="n" aria-label="Next video" ${i<L.length-1?"":"disabled"}>&darr;</button></div>`}
function go(d){const n=i+d;if(n<0||n>=L.length)return;i=n;drawSwipe()}
sw.addEventListener("click",e=>{const t=e.target.closest("[data-s]");if(!t)return;const a=t.dataset.s;
 if(a==="x")closeSwipe();else if(a==="n")go(1);else if(a==="p")go(-1);
 else if(a==="open"){closeSwipe();location.hash="#/watch/"+encodeURIComponent(L[i].id)}
 else if(a==="play"){const em=toEmbed(L[i].embed);if(!em){toast("Invalid embed URL");return}
  $("#sb").innerHTML=`<iframe src="${safe(em)}" title="${esc(L[i].title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  sw.querySelector(".acts").innerHTML=`<button class="btn" data-s="open">Not loading? Open full video</button>`}});
sw.addEventListener("touchstart",e=>{y0=e.touches[0].clientY},{passive:true});
sw.addEventListener("touchend",e=>{if(y0==null)return;const d=y0-e.changedTouches[0].clientY;y0=null;if(Math.abs(d)>60)go(d>0?1:-1)},{passive:true});
sw.addEventListener("wheel",e=>{const n=Date.now();if(n-lock<500||Math.abs(e.deltaY)<20)return;lock=n;go(e.deltaY>0?1:-1)},{passive:true});
addEventListener("keydown",e=>{
 if(!sw.hidden){if(e.key==="Escape")closeSwipe();else if(e.key==="ArrowDown")go(1);else if(e.key==="ArrowUp")go(-1)}
 else if(!adm.hidden&&e.key==="Escape")closeAdmin()});

async function healThumbs(){
 for(const v of V.slice()){
  if(v.sample||!String(v.thumb||"").startsWith("data:image/svg+xml,"))continue;
  const em=toEmbed(v.embed);if(!em)continue;
  const th=await autoThumb(em,v.title,v.cat);
  if(th&&!th.startsWith("data:image/svg")){v.thumb=th;try{if(!cloud||user)await persist(v)}catch(e){}if(location.hash.indexOf("#/watch")!==0&&adm.hidden&&sw.hidden)home()}}}
route();
if(cloud)initCloud().then(healThumbs);else healThumbs();
</script>
